name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read  # CI only reads the repository

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest pytest-cov ruff mypy
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q --cov

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate plugin manifests and launcher
        run: |
          python - <<'PY'
          import json, pathlib
          for f in (".claude-plugin/plugin.json", ".claude-plugin/marketplace.json", "hooks/hooks.json"):
              json.loads(pathlib.Path(f).read_text())
          PY
          python - <<'PY'
          import json, pathlib
          hooks = json.loads(pathlib.Path("hooks/hooks.json").read_text())["hooks"]
          for groups in hooks.values():
              for group in groups:
                  for hook in group["hooks"]:
                      script = hook["args"][0].replace("${CLAUDE_PLUGIN_ROOT}/", "")
                      assert pathlib.Path(script).is_file(), f"missing hook script: {script}"
          PY
          for f in scripts/hooks/*.sh; do bash -n "$f"; done
          test -z "$(git ls-files -s scripts | grep '\.sh$' | grep -v '^100755')"  # executable in git
          test -x scripts/sdd.sh
          bash -n scripts/sdd.sh
          test ! -e bin  # a plugin with bin/ is refused by claude.ai and Cowork

  graphify-lock:
    # The exact-version lock must install on every OS, or automatic graph builds break.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - name: Install the pinned graphify with its lock
        shell: bash
        run: |
          version=$(python -c "import sys; sys.path.insert(0, '.'); from specsteward.config import GRAPHIFY_VERSION; print(GRAPHIFY_VERSION)")
          uv tool install "graphifyy==$version" -c specsteward/graphify-constraints.txt
          # uv's tool folder is not on PATH on every runner (Windows); specsteward looks there too.
          "$(uv tool dir --bin)/graphify" --help >/dev/null

  e2e:
    # The full scripted flow on a copy of the example: init, trust, doctor, analyze,
    # approve --start, next, brief, RED/GREEN gate, review, done, converge, views.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: End-to-end run of the example
        shell: bash
        run: bash scripts/e2e.sh
