[project]
name = "specsteward"
version = "0.3.6"
description = "Spec-driven development on autopilot for Claude Code"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []  # standard library only, so the plugin needs no install step

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["specsteward"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["specsteward"]
