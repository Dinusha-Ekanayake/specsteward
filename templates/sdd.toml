# specsteward configuration (@@STACK@@ project). See docs/configuration.md in the specsteward repo.
# Generated by `sdd init` from what this project already uses. `sdd doctor` checks it.

[project]
specs_dir = "@@SPECS_DIR@@"
branch_prefix = "feature/{spec}-"  # "" turns the branch check off
# The spec's status line, e.g. "- **Status:** Draft". Group 2 is the status value.
status_regex = '(\*\*Status:\*\*\s*)([^\n]*)'
approved_word = "Approved"

# The quality gate. Each step is a command (a list of arguments, no shell).
# `keep` is a regex for the output lines worth showing when the step fails.
# "{python}" is the project's virtual environment if it has one, else the Python running sdd.
@@CHECKS@@
# Formatters run on each file Claude edits, by suffix. {file} is the edited path.
@@FORMAT@@
# Wording the project must never use (case-insensitive regexes). A match right after
# "not", "never" or "no" is allowed. Mark a line "sdd: allow-wording" to allow it.
[wording]
banned = []
scan = @@SCAN@@

# Which model reviews which risk. Implementer is Sonnet, planner Opus, clerk Haiku.
[models]
low = "sonnet"
high = "opus"
human = "opus"

[scope]
# mode = "enforce"   # enforce | warn | off: changes outside the plan's files block `sdd done`
# symbols = "warn"  # enforce | warn | off: public symbols the plan does not name
# surface = "auto"   # auto | enforce | warn | off: new imports/calls that reach out (process,
#                    # network, eval). auto blocks a high-risk or human task, warns for a low one
# growth = "warn"    # enforce | warn | off: a function that grew by more than max_growth nodes
# max_growth = 80
# allow = []         # extra globs a run may always touch

# Changed lines must be run by a test. Point report at the file your test step writes.
[coverage]
# report = "coverage.xml"   # Cobertura XML or lcov
# mode = "auto"             # auto | enforce | warn | off (auto: blocks high-risk and human tasks)

[tdd]
# red_first = "warn"   # warn | enforce | off: a failing test run must come before the passing one

# Per-task reviews. skip = ["low"] saves a reviewer run per low-risk group; the final
# Opus review of the branch still covers those tasks. High and human risk always get one.
[review]
skip = []

[limits]
max_review_rounds = 2
max_fix_attempts = 3
max_agent_runs = 60
restart_after_tasks = 4
max_converge_rounds = 2   # converge passes that may add tasks before shipping
max_tokens = 0          # halt after this many fresh tokens (input, cache writes, output); 0 = off

[groups]
max_size = 3   # low-risk tasks per implementer run
max_high = 2   # high-risk tasks per implementer run

# A code knowledge graph (graphify) that agents query instead of reading files. specsteward
# installs the pinned version if missing and keeps graphify-out/ fresh in the background.
[graphify]
auto = true
# version = "x.y.z"  # override the graphify version this specsteward release pins

[brief]
helper_files = []  # e.g. ["tests/conftest.py"]: always shown to the implementer
graphify = true    # add related graph nodes to briefs (specsteward keeps the graph up to date)
